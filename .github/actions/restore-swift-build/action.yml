name: Restore Swift build cache
description: >-
  Restores the macOS Swift package's .build directory from the Actions cache, then dates the
  tracked Swift sources by their content. The calling job saves the cache itself, with this
  action's outputs, because a composite action cannot run a step after the job's build.

inputs:
  configuration:
    description: The Swift configuration that the job's cargo profile builds, debug or release.
    required: true

outputs:
  cache-hit:
    description: Whether the exact key was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: The exact key, for the job's save step.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Identify the Swift toolchain
      id: toolchain
      shell: pwsh
      env:
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        if ($env:CONFIGURATION -cnotin 'debug', 'release') {
          throw "configuration must be debug or release, not '$env:CONFIGURATION'."
        }
        $developer = xcode-select --print-path
        if ($LASTEXITCODE -ne 0) { throw "No Xcode is selected." }
        $version = Get-Content -Raw -LiteralPath (Join-Path (Split-Path -Parent $developer) 'version.plist')
        if ($version -notmatch '<key>ProductBuildVersion</key>\s*<string>([^<]+)</string>') {
          throw "The selected Xcode at $developer has no build version."
        }
        "Xcode build $($Matches[1]) at $developer"
        $digest = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$developer`n$version"))
        "toolchain=$([Convert]::ToHexString($digest).Substring(0, 16).ToLowerInvariant())" >> $env:GITHUB_OUTPUT

    - name: Restore the package's build directory
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: src-tauri/macos/SideNotch/.build
        key: v0-swiftpm-${{ inputs.configuration }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.toolchain }}-${{ hashFiles('src-tauri/macos/*/Package.swift', 'src-tauri/macos/*/Package.resolved', 'src-tauri/macos/*/Sources/**', 'src-tauri/macos/*/Tests/**') }}
        restore-keys: v0-swiftpm-${{ inputs.configuration }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.toolchain }}-

    - name: Stamp Swift sources with their content
      shell: pwsh
      run: bun scripts/stamp-source-times.mjs src-tauri/macos
