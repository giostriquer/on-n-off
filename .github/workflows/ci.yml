name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test release version contract
        run: ./scripts/check-release-version.test.ps1

      - name: Test frontend
        run: bun run test

      - name: Type-check frontend
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  bundle-windows:
    name: bundle-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installers
        run: bun run tauri build

      - name: Verify Windows installers
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $expectedArtifacts = [ordered]@{
            'src-tauri/target/release/bundle/nsis' = "on-n-off_$env:RELEASE_VERSION`_x64-setup.exe"
            'src-tauri/target/release/bundle/msi' = "on-n-off_$env:RELEASE_VERSION`_x64_en-US.msi"
          }

          foreach ($bundleDirectory in $expectedArtifacts.Keys) {
            $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -File)
            $expectedName = $expectedArtifacts[$bundleDirectory]
            if ($installers.Count -ne 1 -or $installers[0].Name -ne $expectedName) {
              $actualNames = $installers.Name -join ', '
              throw "Expected only '$expectedName' in '$bundleDirectory'; found: $actualNames"
            }
          }
