name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request supersedes its running check. A push to main queues behind the
# running main run instead of cancelling it, so a merge keeps its verdict and its chance to save the
# cache (GitHub still drops a run that is only queued when a newer one queues behind it).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  # Keep this block identical to bundle.yml and release.yml (rust-cache hashes CARGO*/RUST* variables
  # into its key). Incremental artifacts bloat the cache and do not help one-shot CI builds; dropping dev
  # debug info keeps the Windows target directory (PDBs) small and speeds up linking.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Platform-neutral frontend checks. Neither vitest nor tsc can fail on one platform and pass on
  # another, so running them once on Linux keeps roughly 40s off both native legs and off the
  # Windows and macOS runner queues. `bun run build` stays on the native legs: tauri-build needs
  # ui/dist to exist before the Rust steps run.
  #
  # Runner labels are pinned to exact images, like the compiler in rust-toolchain.toml, and bumped
  # deliberately on their own pull request: a `-latest` label moves to a new OS on GitHub's schedule.
  # scripts/workflows.test.mjs holds the one image per OS that every workflow uses, so a bump changes
  # them all.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        id: install
        run: bun install --frozen-lockfile

      # The three checks are independent: once dependencies are installed, each one reports even
      # when an earlier one failed, so a single push shows every failure.
      # The tests run east of UTC on purpose. vitest.config.ts pins every worker to UTC, and fixtures
      # such as 15:00Z fall on the next day in Tokyo, so losing the pin fails here and not only on a
      # developer's machine east of UTC. See ui/src/test-environment.test.ts.
      - name: Test frontend
        run: bun run test
        env:
          TZ: Asia/Tokyo

      - name: Type-check frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check

      - name: Test release scripts and workflow contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test scripts/

  verify:
    name: verify-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025-vs2026
          - platform: macos
            os: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defender scans every object file cargo writes. Excluding the build directories is worth
      # measurable minutes on the Rust steps and costs nothing when it fails, so it never gates
      # the job. Runner-only: never run this on a development machine.
      - name: Exclude build directories from Defender scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath `
            $env:GITHUB_WORKSPACE, `
            (Join-Path $env:USERPROFILE '.cargo'), `
            (Join-Path $env:USERPROFILE '.rustup')

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # rust-toolchain.toml is the single source of truth. Reading the channel here stops the
      # action from installing a `stable` that rustup would then ignore in favour of the pin,
      # which would pay for two toolchain downloads on every release day.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: ./scripts/read-rust-toolchain.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # rust-cache hashes the rustc version of EVERY installed toolchain into its environment
      # key (it runs `rustup toolchain list`), not just the active one. The runner images carry
      # their own `stable`, so the pin alone left two toolchains present and the key still moved
      # whenever the image's stable moved -- which is what rotated it to b6ac5207 on the first
      # run of this change. Reducing the set to the pin makes the hash depend only on
      # rust-toolchain.toml.
      - name: Drop unpinned toolchains
        run: ./scripts/prune-rust-toolchains.ps1 -Keep '${{ steps.toolchain.outputs.channel }}'

      # rustfmt needs neither the cache nor the registry, and it is the most common reason this job
      # fails, so it runs before everything slow and reports in well under a minute.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Pre-resolves SwiftPM with retries so the cargo build script never fetches. The script's
      # header says why, and why ~/Library/Caches/org.swift.swiftpm is never cached.
      - name: Resolve Swift package dependencies
        if: runner.os == 'macOS'
        run: ./scripts/resolve-swift-packages.ps1 -PackagePath src-tauri/macos/BrowserBilling

      # Only pushes to main write the cache so pull requests cannot evict it; every ref can
      # restore the cache that main saved. `cache-on-failure` is deliberately off: the store is
      # capped at 10 GB for the whole repository and a failed run's half-built target directory
      # is not worth a slot. See .github/workflows/cache-prune.yml.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: verify-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test release version contract
        run: ./scripts/check-release-version.test.ps1

      - name: Test bundle helper
        run: ./scripts/build-bundle.test.ps1

      - name: Test updater feed generator
        run: ./scripts/new-update-feed.test.ps1

      - name: Test Rust toolchain reader
        run: ./scripts/read-rust-toolchain.test.ps1

      - name: Test Rust toolchain pruner
        run: ./scripts/prune-rust-toolchains.test.ps1

      - name: Test Swift package resolver
        run: ./scripts/resolve-swift-packages.test.ps1

      - name: Build frontend
        run: bun run build

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      # This step takes one to two minutes warm and a few more cold. A test blocked on a request
      # that never comes should fail here, not at the job's 45-minute limit.
      - name: Test Rust
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: bun run tauri build --debug --no-bundle

      - name: Check native notch models and lifecycle
        if: runner.os == 'macOS'
        run: |
          xcrun swift run --package-path src-tauri/macos/SideNotch -Xswiftc -warnings-as-errors NotchCoreChecks
          if ($LASTEXITCODE -ne 0) { throw "Native notch model checks failed." }
          bun scripts/check-native-notch.mjs src-tauri/target/debug/on-n-off-notch
          if ($LASTEXITCODE -ne 0) { throw "Native notch lifecycle checks failed." }
          xcrun swift run --package-path src-tauri/macos/BrowserBilling -Xswiftc -warnings-as-errors BrowserBillingChecks
          if ($LASTEXITCODE -ne 0) { throw "Browser billing checks failed." }
          bun scripts/check-billing-resources.mjs
          if ($LASTEXITCODE -ne 0) { throw "Billing resource signing checks failed." }
