name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  # Incremental artifacts bloat the cache and do not help one-shot CI builds; dropping dev
  # debug info keeps the Windows target directory (PDBs) small and speeds up linking.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy

      # Only pushes to main write the cache so pull requests cannot evict it; every ref can
      # restore the cache that main saved.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: verify-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test release version contract
        run: ./scripts/check-release-version.test.ps1

      - name: Test bundle helper
        run: ./scripts/build-bundle.test.ps1

      - name: Test updater feed generator
        run: ./scripts/new-update-feed.test.ps1

      - name: Test frontend
        run: bun run test

      - name: Type-check frontend
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  # Installer smoke for main. It runs alongside verify rather than after it: tauri build already
  # compiles the app, so a broken build fails here on its own, and the release workflow restores
  # the release-profile cache this job saves.
  bundle:
    name: bundle-${{ matrix.installer }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: nsis
            platform: windows
            os: windows-latest
          - installer: msi
            platform: windows
            os: windows-latest
          - installer: dmg
            platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      # Shared with the release workflow's build job (same key, same release profile).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: bundle-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and verify installer bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: ./scripts/build-bundle.ps1 -InstallerKind $env:INSTALLER_KIND -ReleaseVersion $env:RELEASE_VERSION
