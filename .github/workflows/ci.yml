name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install frontend dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Test frontend
        run: bun run test
        env:
          TZ: Asia/Tokyo

      - name: Type-check frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check

      - name: Test release scripts and workflow contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test scripts/

  windows:
    name: windows
    uses: ./.github/workflows/verify.yml
    with:
      platform: windows
      os: windows-2025-vs2026

  macos:
    name: macos
    uses: ./.github/workflows/verify.yml
    with:
      platform: macos
      os: macos-26

  verify-windows:
    name: verify-windows
    needs: windows
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - &require-success
        name: Require every needed job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -r 'to_entries[] | select(.value.result != "success") | "::error title=\(.key)::\(.key) finished as \(.value.result | tojson), not \"success\"."' <<< "$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::Not every needed job succeeded, or this job needs none."
            exit 1
          fi

  verify-macos:
    name: verify-macos
    needs: macos
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *require-success
