name: Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never cancel a running bundle for main: each merge keeps its installer smoke and the cache it
# saves. The pull request condition only matters if this workflow ever runs on pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

# Keep this block identical to ci.yml and release.yml: rust-cache hashes CARGO*/RUST* variables into
# its key, and the release workflow's build job restores the cache the bundle job saves.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Installer smoke for main. It runs alongside the CI workflow rather than after it: tauri build
  # already compiles the app, so a broken build fails here on its own, and the release workflow
  # restores the release-profile cache this job saves.
  #
  # Runner labels are pinned to exact images and bumped deliberately, like rust-toolchain.toml; keep
  # them equal to ci.yml's and release.yml's.
  bundle:
    name: bundle-${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: nsis
            platform: windows
            os: windows-2025-vs2026
          - installer: dmg
            platform: macos
            os: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defender scans every object file cargo writes; the release-profile bundle build is the
      # heaviest Rust step in the pipeline. Never gates the job. Runner-only.
      - name: Exclude build directories from Defender scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath `
            $env:GITHUB_WORKSPACE, `
            (Join-Path $env:USERPROFILE '.cargo'), `
            (Join-Path $env:USERPROFILE '.rustup')

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # rust-toolchain.toml is the single source of truth; see the comment in that file for why
      # the pin exists at all.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: ./scripts/read-rust-toolchain.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # rust-cache hashes the rustc version of EVERY installed toolchain into its environment
      # key (it runs `rustup toolchain list`), not just the active one. The runner images carry
      # their own `stable`, so the pin alone left two toolchains present and the key still moved
      # whenever the image's stable moved -- which is what rotated it to b6ac5207 on the first
      # run of this change. Reducing the set to the pin makes the hash depend only on
      # rust-toolchain.toml.
      - name: Drop unpinned toolchains
        run: ./scripts/prune-rust-toolchains.ps1 -Keep '${{ steps.toolchain.outputs.channel }}'

      # Pre-resolves SwiftPM with retries so the build script never fetches; see the same step in
      # ci.yml for why, and why ~/Library/Caches/org.swift.swiftpm is never cached.
      - name: Resolve Swift package dependencies
        if: runner.os == 'macOS'
        run: |
          $package = 'src-tauri/macos/BrowserBilling'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ($attempt -eq 1) {
              xcrun swift package resolve --package-path $package
            } else {
              Remove-Item -LiteralPath (Join-Path $package '.build') -Recurse -Force -ErrorAction Ignore
              xcrun swift package resolve --package-path $package --disable-dependency-cache
            }
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Write-Warning "Swift package resolution failed (attempt $attempt of 3); retrying in $(15 * $attempt) s."
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          throw "Could not resolve the Swift packages in $package after 3 attempts."

      # Shared with the release workflow's build job (same key, same release profile).
      # `cache-on-failure` is deliberately off: the store is capped at 10 GB for the whole
      # repository and a failed run's half-built target directory is not worth a slot.
      # See .github/workflows/cache-prune.yml.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: bundle-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and verify installer bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: ./scripts/build-bundle.ps1 -InstallerKind $env:INSTALLER_KIND -ReleaseVersion $env:RELEASE_VERSION
