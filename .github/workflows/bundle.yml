name: Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

# Keep this block identical to ci.yml and release.yml: rust-cache hashes CARGO*/RUST* variables into
# its key, and the release workflow's build job restores the cache the bundle job saves.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Installer smoke for main. It runs alongside the CI workflow rather than after it: tauri build
  # already compiles the app, so a broken build fails here on its own, and the release workflow
  # restores the release-profile cache this job saves.
  bundle:
    name: bundle-${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: nsis
            platform: windows
            os: windows-latest
          - installer: dmg
            platform: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      # Shared with the release workflow's build job (same key, same release profile).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: bundle-${{ matrix.platform }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and verify installer bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: ./scripts/build-bundle.ps1 -InstallerKind $env:INSTALLER_KIND -ReleaseVersion $env:RELEASE_VERSION
