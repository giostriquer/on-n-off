name: Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never cancel a running bundle: each merge keeps its installer smoke and the cache it saves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

# Keep this block identical to ci.yml and release.yml: rust-cache hashes CARGO*/RUST* variables into
# its key, and the release workflow's build job restores the cache the bundle job saves.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Installer smoke for main. It runs alongside the CI workflow rather than after it: tauri build
  # already compiles the app, so a broken build fails here on its own, and the release workflow
  # restores the release-profile cache this job saves.
  #
  # Runner labels are pinned and bumped together; see ci.yml.
  bundle:
    name: bundle-${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: nsis
            platform: windows
            os: windows-2025-vs2026
          - installer: dmg
            platform: macos
            os: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bun hardlinks packages from its install cache into node_modules, which only works on one
      # drive; see ci.yml. RUNNER_TEMP is on the workspace drive.
      - name: Keep the bun cache on the workspace drive
        if: runner.os == 'Windows'
        run: |
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'bun-install-cache')" >> $env:GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # rust-toolchain.toml is the single source of truth; see the comment in that file for why
      # the pin exists at all.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: ./scripts/read-rust-toolchain.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-05
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # rust-cache hashes the rustc version of EVERY installed toolchain into its environment
      # key (it runs `rustup toolchain list`), not just the active one. The runner images carry
      # their own `stable`, so the pin alone left two toolchains present and the key still moved
      # whenever the image's stable moved -- which is what rotated it to b6ac5207 on the first
      # run of this change. Reducing the set to the pin makes the hash depend only on
      # rust-toolchain.toml.
      - name: Drop unpinned toolchains
        run: ./scripts/prune-rust-toolchains.ps1 -Keep '${{ steps.toolchain.outputs.channel }}'

      # The Swift packages' .build directories, cached as in ci.yml, but for the release
      # configuration that `tauri build` asks for. The release workflow's build job restores this
      # entry; this job saves it (the job's last step).
      - name: Identify the Swift toolchain
        id: swift
        if: runner.os == 'macOS'
        run: |
          $developer = xcode-select --print-path
          if ($LASTEXITCODE -ne 0) { throw "No Xcode is selected." }
          $version = Get-Content -Raw -LiteralPath (Join-Path (Split-Path -Parent $developer) 'version.plist')
          if ($version -notmatch '<key>ProductBuildVersion</key>\s*<string>([^<]+)</string>') {
            throw "The selected Xcode at $developer has no build version."
          }
          "Xcode build $($Matches[1]) at $developer"
          $digest = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$developer`n$version"))
          "toolchain=$([Convert]::ToHexString($digest).Substring(0, 16).ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore Swift build cache
        id: swift-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/macos/SideNotch/.build
            src-tauri/macos/BrowserBilling/.build
          key: v0-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-${{ hashFiles('src-tauri/macos/*/Package.swift', 'src-tauri/macos/*/Package.resolved', 'src-tauri/macos/*/Info.plist', 'src-tauri/macos/*/Sources/**', 'src-tauri/macos/*/Tests/**') }}
          restore-keys: v0-swiftpm-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.toolchain }}-

      # See ci.yml: a restored build otherwise recompiles on-n-off's own Swift modules.
      - name: Stamp Swift sources with their content
        if: runner.os == 'macOS'
        run: bun scripts/stamp-source-times.mjs src-tauri/macos

      # Pre-resolves SwiftPM with retries so the cargo build script never fetches. The script's
      # header says why, and why ~/Library/Caches/org.swift.swiftpm is never cached.
      - name: Resolve Swift package dependencies
        if: runner.os == 'macOS'
        run: ./scripts/resolve-swift-packages.ps1 -PackagePath src-tauri/macos/BrowserBilling

      # Shared with the release workflow's build job (same key, same release profile).
      # `cache-on-failure` is deliberately off: the store is capped at 10 GB for the whole
      # repository and a failed run's half-built target directory is not worth a slot.
      # See .github/workflows/cache-prune.yml.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: bundle-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and verify installer bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_KIND: ${{ matrix.installer }}
        run: ./scripts/build-bundle.ps1 -InstallerKind $env:INSTALLER_KIND -ReleaseVersion $env:RELEASE_VERSION

      # This workflow only runs on main; the ref check keeps the rule the same as ci.yml's.
      - name: Save Swift build cache
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/macos/SideNotch/.build
            src-tauri/macos/BrowserBilling/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
