name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate annotated release tag
        run: |
          $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
          $tagType = git cat-file -t $tagRef
          if ($LASTEXITCODE -ne 0 -or $tagType -ne 'tag') {
            throw "Release tag '$env:GITHUB_REF_NAME' must be an annotated tag."
          }

      - name: Validate tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main."
          }

          $taggedCommit = git rev-parse "refs/tags/$($env:GITHUB_REF_NAME)^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the release tag to a commit."
          }

          git merge-base --is-ancestor $taggedCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:GITHUB_REF_NAME' is not on origin/main."
          }

      - name: Validate release version contract
        run: ./scripts/check-release-version.ps1 -ExpectedTag $env:GITHUB_REF_NAME

      - name: Test release version contract
        run: ./scripts/check-release-version.test.ps1

      - name: Test Windows flavor helper
        run: ./scripts/build-windows-flavor.test.ps1

      - name: Test updater feed generator
        run: ./scripts/new-update-feed.test.ps1

      - name: Test frontend
        run: bun run test

      - name: Type-check frontend
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

  build-windows:
    name: build-windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version contract
        id: version
        run: |
          $versionLine = ./scripts/check-release-version.ps1 -ExpectedTag $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            throw "Release version validation failed."
          }

          $version = $versionLine -replace '^version=', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The version checker returned an invalid value: $versionLine"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build signed Windows updater flavors
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Updater signing secrets are not configured.'
          }
          ./scripts/build-windows-flavor.ps1 -InstallerKind nsis -ReleaseVersion $env:RELEASE_VERSION -SignedUpdater
          ./scripts/build-windows-flavor.ps1 -InstallerKind msi -ReleaseVersion $env:RELEASE_VERSION -SignedUpdater

      - name: Stage release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null

          $sourceFiles = @(
            "src-tauri/target/release/bundle/nsis/on-n-off_$env:RELEASE_VERSION`_x64-setup.exe",
            "src-tauri/target/release/bundle/nsis/on-n-off_$env:RELEASE_VERSION`_x64-setup.exe.sig",
            "src-tauri/target/release/bundle/msi/on-n-off_$env:RELEASE_VERSION`_x64_en-US.msi",
            "src-tauri/target/release/bundle/msi/on-n-off_$env:RELEASE_VERSION`_x64_en-US.msi.sig",
            'LICENSE',
            'THIRD_PARTY_NOTICES.md'
          )

          foreach ($sourceFile in $sourceFiles) {
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
              throw "Expected release asset was not produced: $sourceFile"
            }

            Copy-Item -LiteralPath $sourceFile -Destination $assetDirectory
          }

          $checksumLines = Get-ChildItem -LiteralPath $assetDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          $checksumPath = Join-Path $assetDirectory 'STAGED_SHA256SUMS.txt'
          [System.IO.File]::WriteAllLines(
            $checksumPath,
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-draft:
    name: publish-draft
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets

      - name: Verify staged asset checksums
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $expectedNames = @(
            "on-n-off_$version`_x64-setup.exe",
            "on-n-off_$version`_x64-setup.exe.sig",
            "on-n-off_$version`_x64_en-US.msi",
            "on-n-off_$version`_x64_en-US.msi.sig",
            'LICENSE',
            'THIRD_PARTY_NOTICES.md'
          ) | Sort-Object

          $checksumPath = Join-Path $assetDirectory 'STAGED_SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw 'STAGED_SHA256SUMS.txt is missing.'
          }

          $actualNames = @()
          foreach ($line in [System.IO.File]::ReadAllLines($checksumPath)) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>[^\\/]+)$') {
              throw "Invalid checksum entry: $line"
            }

            $name = $Matches.name
            $assetPath = Join-Path $assetDirectory $name
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Checksummed release asset is missing: $name"
            }

            $actualHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $Matches.hash) {
              throw "Checksum mismatch for release asset: $name"
            }

            $actualNames += $name
          }

          if (Compare-Object $expectedNames ($actualNames | Sort-Object)) {
            throw 'The staged checksum set does not match the expected release assets.'
          }

          Remove-Item -LiteralPath $checksumPath

      - name: Prepare draft release and updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY

          $releaseJson = gh api "repos/$repository/releases/tags/$tag" 2>&1
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.draft) {
              throw "Release '$tag' already exists and is not a draft. Refusing to modify it."
            }
          } elseif ($releaseJson -match '(?i)HTTP 404|not found') {
            $warning = @(
              '> [!WARNING]',
              '> These Windows installers are currently unsigned. Windows can show an unrecognized publisher warning. Verify the SHA-256 checksum or GitHub artifact attestation before installation.'
            ) -join [Environment]::NewLine

            gh release create $tag `
              --repo $repository `
              --draft `
              --verify-tag `
              --title "on-n-off $tag" `
              --generate-notes `
              --notes $warning
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft release '$tag'."
            }
          } else {
            throw "Could not inspect release '$tag': $releaseJson"
          }

          $draft = gh release view $tag --repo $repository --json isDraft,body,createdAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) {
            throw "Release '$tag' is not an editable draft."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText(
            $notesPath,
            [string] $draft.body,
            [System.Text.UTF8Encoding]::new($false)
          )
          ./scripts/new-update-feed.ps1 `
            -AssetDirectory $assetDirectory `
            -Repository $repository `
            -Tag $tag `
            -ReleaseNotesPath $notesPath `
            -PublishedAt ([string] $draft.createdAt) `
            -OutputPath (Join-Path $assetDirectory 'latest.json')

          $checksumLines = Get-ChildItem -LiteralPath $assetDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $assetDirectory 'SHA256SUMS.txt'),
            $checksumLines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Attest Windows installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/*.exe
            ${{ runner.temp }}/release-assets/*.msi

      - name: Upload and reconcile draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'release-assets'
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $assets = Get-ChildItem -LiteralPath $assetDirectory -File |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 8) {
            throw "Expected eight release assets, found $($assets.Count)."
          }

          $expectedNames = $assets | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object
          $existing = gh release view $tag --repo $repository --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $existing.isDraft) {
            throw "Release '$tag' is not an editable draft before upload."
          }
          foreach ($asset in $existing.assets) {
            if ($asset.name -notin $expectedNames) {
              gh release delete-asset $tag $asset.name --repo $repository --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove stale draft asset '$($asset.name)'."
              }
            }
          }

          gh release upload $tag $assets --repo $repository --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload assets to draft release '$tag'."
          }

          $publishedRelease = gh release view $tag --repo $repository --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $publishedRelease.isDraft) {
            throw "Release '$tag' is not a draft after upload."
          }

          $uploadedNames = $publishedRelease.assets | ForEach-Object name | Sort-Object
          if (Compare-Object $expectedNames $uploadedNames) {
            throw "Release '$tag' does not contain the expected asset set."
          }
