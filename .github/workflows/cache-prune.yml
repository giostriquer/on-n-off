name: Prune caches

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: Generations to keep per shared key
        required: false
        default: "2"
      dry-run:
        description: List what would be deleted without deleting it
        type: boolean
        required: false
        default: false

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prune:
    name: prune
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete superseded cache generations
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep || '2' }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $keep = [int]$env:KEEP
          if ($keep -lt 1) {
            throw "Refusing to keep fewer than one generation per shared key."
          }
          $dryRun = $env:DRY_RUN -eq 'true'
          $repository = $env:GITHUB_REPOSITORY

          $caches = @()
          $page = 1
          while ($true) {
            $response = gh api "repos/$repository/actions/caches?per_page=100&page=$page" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list caches."
            }
            if ($response.actions_caches.Count -eq 0) {
              break
            }
            $caches += $response.actions_caches
            $page++
          }

          $totalBytes = ($caches | Measure-Object -Property size_in_bytes -Sum).Sum
          Write-Output ("Store holds {0} entries, {1:N2} GB." -f $caches.Count, ($totalBytes / 1GB))

          $managed = @($caches | Where-Object { $_.key -like 'v0-rust-*' -or $_.key -like 'v0-swiftpm-*' })
          if ($managed.Count -eq 0) {
            Write-Output "No rust-cache or Swift build cache entries found; nothing to prune."
            exit 0
          }

          $doomed = @()
          foreach ($group in $managed | Group-Object { $fields = $_.key -split '-'; $fields[0..($fields.Count - 3)] -join '-' }) {
            $ordered = @($group.Group | Sort-Object { [datetime]$_.last_accessed_at } -Descending)
            Write-Output "$($group.Name): $($ordered.Count) generation(s), keeping $([Math]::Min($keep, $ordered.Count))."
            if ($ordered.Count -gt $keep) {
              $doomed += $ordered[$keep..($ordered.Count - 1)]
            }
          }

          if ($doomed.Count -eq 0) {
            Write-Output "Nothing to prune."
            exit 0
          }

          $freed = ($doomed | Measure-Object -Property size_in_bytes -Sum).Sum
          Write-Output ("Pruning {0} entries, freeing {1:N2} GB." -f $doomed.Count, ($freed / 1GB))

          foreach ($cache in $doomed) {
            Write-Output ("  {0,8:N0} MB  {1}" -f ($cache.size_in_bytes / 1MB), $cache.key)
            if (-not $dryRun) {
              gh api --method DELETE "repos/$repository/actions/caches/$($cache.id)" --silent
              if ($LASTEXITCODE -ne 0) {
                Write-Output "    already gone"
              }
            }
          }

          if ($dryRun) {
            Write-Output "Dry run: nothing was deleted."
          }
