[package]
name = "on-n-off"
version = "0.5.1"
description = "Desktop manager for Claude, Codex, and Antigravity plugins, skills, MCP servers, and agent configuration"
authors = ["Giovanne Striquer"]
edition = "2021"
license = "MIT"
repository = "https://github.com/giostriquer/on-n-off"
homepage = "https://github.com/giostriquer/on-n-off"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "on_n_off_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["block2", "UNUserNotificationCenter"] }
