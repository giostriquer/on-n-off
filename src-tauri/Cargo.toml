[package]
name = "on-n-off"
version = "0.1.0"
description = "Plugin and skill manager for Claude and Codex"
authors = ["giostriquer"]
edition = "2021"

[lib]
name = "on_n_off_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
