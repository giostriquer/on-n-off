[package]
name = "on-n-off"
version = "0.1.2"
description = "Desktop manager for Claude, Codex, and Antigravity plugins, skills, MCP servers, and agent configuration"
authors = ["Giovanne Striquer"]
edition = "2021"
license = "MIT"
repository = "https://github.com/giostriquer/on-n-off"
homepage = "https://github.com/giostriquer/on-n-off"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "on_n_off_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
ureq = "2"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
