[package]
name = "on-n-off"
version = "0.27.1"
description = "Desktop manager for Claude, Codex, and Antigravity plugins, skills, MCP servers, and agent configuration"
authors = ["Giovanne Striquer"]
edition = "2021"
license = "MIT"
repository = "https://github.com/giostriquer/on-n-off"
homepage = "https://github.com/giostriquer/on-n-off"

[lints.rust]
unsafe_code = "deny"

[features]
default = ["single-instance"]
single-instance = []

[lib]
name = "on_n_off_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
chacha20poly1305 = "0.10"
filetime = "0.2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
toml_edit = "0.25"
ureq = "3"
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
base64 = "0.23"
regex = "1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.55"
tao = "0.35"
tiny-skia = "0.12"
windows = { version = "0.61", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSError", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
